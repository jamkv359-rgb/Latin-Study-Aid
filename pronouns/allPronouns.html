<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronouns Condensed</title>
    <link rel="stylesheet" href="../theme.css">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: min(1000px, 92vw);
            margin: 40px 0;
        }

        header {
            padding: 20px 24px;
            border-radius: calc(14px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(14px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(14px * var(--radius-mult-br, var(--radius-mult, 1))) calc(14px * var(--radius-mult-bl, var(--radius-mult, 1)));
            margin-bottom: 20px;
        }

        .stem {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 10px;
        }

        #settingsPanel {
            padding: 20px;
            border-radius: calc(14px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(14px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(14px * var(--radius-mult-br, var(--radius-mult, 1))) calc(14px * var(--radius-mult-bl, var(--radius-mult, 1)));
            margin-bottom: 20px;
        }

        #settingsPanel h2 {
            margin-bottom: 15px;
        }

        .filterGrid,
        .settings {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
            width: 100%;
        }

        .filterGroup {
            background: var(--card);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: calc(50% - 10px);
            box-sizing: border-box;
        }

        .filterGroup h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .filterGroup label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            text-align: left;
        }

        .filterGroup input,
        .check {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            padding: 10px 14px;
            cursor: pointer;
            transition: 0.25s ease;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: calc(10px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(10px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(10px * var(--radius-mult-br, var(--radius-mult, 1))) calc(10px * var(--radius-mult-bl, var(--radius-mult, 1)));
            font-weight: 600;
            font-family: inherit;
        }

        button:hover {
            opacity: 0.9;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: calc(14px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(14px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(14px * var(--radius-mult-br, var(--radius-mult, 1))) calc(14px * var(--radius-mult-bl, var(--radius-mult, 1)));
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
            overflow: hidden;
        }

        td input {
            width: 100%;
            padding: 8px;
            outline: none;
            transition: 0.15s ease;
            box-sizing: border-box;
        }

        @media (max-width: 700px) {
            .filterGroup {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }
        }
        select {
            width: 100%;
            padding: 10px;
            outline: none;
            box-sizing: border-box;
        }

        .adContainer {
    margin: 20px 0;
    width: min(1000px, 100%);
  }

  .ads {
    display: flex;
    gap: 10px;
  }

  .ad {
    padding: 10px;
    flex: 1;
    cursor: pointer;
    transition: all 0.2s;
    width: calc(20% - 10px);
  }
  .bottom {
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    }
    </style>
    <script src="../interact.js"></script>
</head>
<body data-page-type="pronoun">
<img class="banner" src="../banner2.png" alt="" style="width: 100%; position: fixed;  height: 10vh; object-fit: cover; top: 0; left: 0;   z-index: 9999;" >
    <div class="container" style="margin-top:15vh;">

    <header>
        <h2>Latin Pronoun Drill</h2>
        <div style="color:var(--muted); margin: 5px 0px 0px 0px"><span id="username-greet"></span>Select what word you want, then start testing~</div>
        <div class="stem">
            <strong>Pronouns</strong> • Masculine • Feminine • Neuter
        </div>

        <div class="stem">
            <strong>Tab</strong> → Next input in row
        </div>
        <div class="stem">
            <strong>Enter</strong> → Next input in column
        </div>
        <div style="display:flex; gap:10px;">
        <div class='interact' style= "background: var(--bg); border: 1px solid var(--border); border-radius: calc(15px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(15px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(15px * var(--radius-mult-br, var(--radius-mult, 1))) calc(15px * var(--radius-mult-bl, var(--radius-mult, 1))); width: fit-content; padding: 5px 15px 5px 15px; margin-bottom: 24px; margin-top: 10px;"></div>
        </div>
    </header>

    <section id="settingsPanel">
        <h2>Select Forms To Test</h2>

        <div class="filterGrid">
            <div class="filterGroup">
                <h3>Pronoun</h3>
                <select id="pronounSelect">
                    <!-- populated from pronounDefs in JS -->
                </select>
            </div>

            <div class="filterGroup">
                <h3>Numbers</h3>
                <label><input type="checkbox" class="check" data-group="number" value="singular" checked> Singular</label>
                <label><input type="checkbox" class="check" data-group="number" value="plural" checked> Plural</label>
            </div>

            <div class="filterGroup">
                <h3>Cases</h3>
                <label><input type="checkbox" class="check" data-group="case" value="nom" checked> Nominative</label>
                <label><input type="checkbox" class="check" data-group="case" value="acc" checked> Accusative</label>
                <label><input type="checkbox" class="check" data-group="case" value="gen" checked> Genitive</label>
                <label><input type="checkbox" class="check" data-group="case" value="dat" checked> Dative</label>
                <label><input type="checkbox" class="check" data-group="case" value="abl" checked> Ablative</label>
            </div>
        </div>

        <div class="controls">
            <button id="submit-btn" onclick="checkAnswers()">Submit</button>
            <button id="reset-btn" onclick="resetTable()">Reset</button>
        </div>
    </section>
     <section class="result hidden" style="width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: calc(16px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(16px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(16px * var(--radius-mult-br, var(--radius-mult, 1))) calc(16px * var(--radius-mult-bl, var(--radius-mult, 1))); padding: 20px; box-shadow: var(--shadow); box-sizing: border-box;margin-bottom:15px;">

                <div><strong>Finished!</strong></div>
                <div class="results" style="display: flex; flex-wrap: wrap; width: 100%; flex-direction: row;">

                </div>
                
                <style>.hidden{display:none;}</style>
            </section>
    <div class="table-wrapper">
        <table id="pronounTable">
            <thead id="pronounTableHead"></thead>

            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <section id="testPanel" style="display:none">
        
        <div id="tablesContainer"></div>

        <div class="controls">
            <button id="showAnswersBtn">Show Answers</button>
            <button id="restartBtn">Restart Test</button>
            <button id="rerenderBtn">Re-render Table</button>
        </div>
    </section>
</div>
<script src="../achievementData.js"></script>
    <script>
        const cases = [
            { key: "nom", label: "Nom" },
            { key: "acc", label: "Acc" },
            { key: "gen", label: "Gen" },
            { key: "dat", label: "Dat" },
            { key: "abl", label: "Abl" }
        ];

        const numbers = [
            { key: "singular", label: "Singular" },
            { key: "plural", label: "Plural" }
        ];

        // Row labels in the same order as pronounData's per-pronoun arrays,
        // for the "you entered a different case/number's ending" hint in
        // checkAnswers().
        const rowLabels = [];
        numbers.forEach(numberObj => {
            cases.forEach(caseObj => {
                rowLabels.push(`${caseObj.label} ${numberObj.label}`);
            });
        });

        // Display order/labels for the filter checkboxes and table column
        // groups. Each key indexes into pronounData below.
        const pronounDefs = [
            { key: "hic", label: "Hic, Haec, Hoc" },
            { key: "ille", label: "Ille, Illa, Illud" },
            { key: "iste", label: "Iste, Ista, Istud" },
            { key: "is", label: "Is, Ea, Id" },
            { key: "idem", label: "Idem, Eadem, Idem" },
            { key: "ipse", label: "Ipse, Ipsa, Ipsum" },
            { key: "qui", label: "Qui, Quae, Quod" },
            { key: "quidam", label: "Quidam, Quaedam, Quoddam" },
            { key: "totus", label: "Totus, Tota, Totum" }
        ];

        // Each entry: 10 rows (nom/acc/gen/dat/abl singular, then plural) x
        // 3 columns (masculine, feminine, neuter).
        const pronounData = {
            hic: [
                ["hic", "haec", "hoc"], ["hunc", "hanc", "hoc"], ["huius", "huius", "huius"], ["huic", "huic", "huic"], ["hoc", "hac", "hoc"],
                ["hi", "hae", "haec"], ["hos", "has", "haec"], ["horum", "harum", "horum"], ["his", "his", "his"], ["his", "his", "his"]
            ],
            ille: [
                ["ille", "illa", "illud"], ["illum", "illam", "illud"], ["illius", "illius", "illius"], ["illi", "illi", "illi"], ["illo", "illa", "illo"],
                ["illi", "illae", "illa"], ["illos", "illas", "illa"], ["illorum", "illarum", "illorum"], ["illis", "illis", "illis"], ["illis", "illis", "illis"]
            ],
            qui: [
                ["qui", "quae", "quod"], ["quem", "quam", "quod"], ["cuius", "cuius", "cuius"], ["cui", "cui", "cui"], ["quo", "qua", "quo"],
                ["qui", "quae", "quae"], ["quos", "quas", "quae"], ["quorum", "quarum", "quorum"], ["quibus", "quibus", "quibus"], ["quibus", "quibus", "quibus"]
            ],
            is: [
                ["is", "ea", "id"], ["eum", "eam", "id"], ["eius", "eius", "eius"], ["ei", "ei", "ei"], ["eo", "ea", "eo"],
                ["ei", "eae", "ea"], ["eos", "eas", "ea"], ["eorum", "earum", "eorum"], ["eis", "eis", "eis"], ["eis", "eis", "eis"]
            ],
            iste: [
                ["iste", "ista", "istud"], ["istum", "istam", "istud"], ["istius", "istius", "istius"], ["isti", "isti", "isti"], ["isto", "ista", "isto"],
                ["isti", "istae", "ista"], ["istos", "istas", "ista"], ["istorum", "istarum", "istorum"], ["istis", "istis", "istis"], ["istis", "istis", "istis"]
            ],
            ipse: [
                ["ipse", "ipsa", "ipsum"], ["ipsum", "ipsam", "ipsum"], ["ipsius", "ipsius", "ipsius"], ["ipsi", "ipsi", "ipsi"], ["ipso", "ipsa", "ipso"],
                ["ipsi", "ipsae", "ipsa"], ["ipsos", "ipsas", "ipsa"], ["ipsorum", "ipsarum", "ipsorum"], ["ipsis", "ipsis", "ipsis"], ["ipsis", "ipsis", "ipsis"]
            ],
            // "idem" = is/ea/id + the invariable suffix "-dem", with the
            // regular euphonic change of a final -m to -n before that d
            // (eum+dem -> eundem, not "eumdem"; eorum+dem -> eorundem).
            idem: [
                ["idem", "eadem", "idem"], ["eundem", "eandem", "idem"], ["eiusdem", "eiusdem", "eiusdem"], ["eidem", "eidem", "eidem"], ["eodem", "eadem", "eodem"],
                ["eidem", "eaedem", "eadem"], ["eosdem", "easdem", "eadem"], ["eorundem", "earundem", "eorundem"], ["eisdem", "eisdem", "eisdem"], ["eisdem", "eisdem", "eisdem"]
            ],
            // "quidam" = qui/quae/quod + the invariable suffix "-dam", same
            // -m -> -n euphonic change (quem+dam -> quendam, not "quemdam").
            quidam: [
                ["quidam", "quaedam", "quoddam"], ["quendam", "quandam", "quoddam"], ["cuiusdam", "cuiusdam", "cuiusdam"], ["cuidam", "cuidam", "cuidam"], ["quodam", "quadam", "quodam"],
                ["quidam", "quaedam", "quaedam"], ["quosdam", "quasdam", "quaedam"], ["quorundam", "quarundam", "quorundam"], ["quibusdam", "quibusdam", "quibusdam"], ["quibusdam", "quibusdam", "quibusdam"]
            ],
            // "totus" (whole) - one of the classic "unus nauta" 1st/2nd
            // declension adjectives with an irregular genitive singular in
            // -ius and dative singular in -i for every gender.
            totus: [
                ["totus", "tota", "totum"], ["totum", "totam", "totum"], ["totius", "totius", "totius"], ["toti", "toti", "toti"], ["toto", "tota", "toto"],
                ["toti", "totae", "tota"], ["totos", "totas", "tota"], ["totorum", "totarum", "totorum"], ["totis", "totis", "totis"], ["totis", "totis", "totis"]
            ]
        };

        function buildPronounSelect() {
            const select = document.getElementById("pronounSelect");
            select.innerHTML = pronounDefs.map(p => `<option value="${p.key}">${p.label}</option>`).join("");
        }

        function getSelectedValues(groupName) {
            return [
                ...document.querySelectorAll(`[data-group="${groupName}"]:checked`)
            ].map(cb => cb.value);
        }

        function getAnswerRowIndex(numberKey, caseKey) {
            const caseIndex = cases.findIndex(c => c.key === caseKey);
            const numberIndex = numbers.findIndex(n => n.key === numberKey);
            return numberIndex * cases.length + caseIndex;
        }

        function getVisibleRows() {
            const selectedCases = getSelectedValues("case");
            const selectedNumbers = getSelectedValues("number");
            const visibleCases = cases.filter(c => selectedCases.includes(c.key));
            const visibleNumbers = numbers.filter(n => selectedNumbers.includes(n.key));

            let rows = [];
            visibleNumbers.forEach(numberObj => {
                visibleCases.forEach(caseObj => {
                    rows.push({
                        caseKey: caseObj.key,
                        caseLabel: caseObj.label,
                        numberKey: numberObj.key,
                        numberLabel: numberObj.label,
                        answerRowIndex: getAnswerRowIndex(numberObj.key, caseObj.key)
                    });
                });
            });
            return rows;
        }

        function getVisiblePronouns() {
            const selectedKey = document.getElementById("pronounSelect").value;
            const match = pronounDefs.find(p => p.key === selectedKey);
            return match ? [match] : [];
        }

        function isEndOfVisibleRowGroup(rows, index) {
            const current = rows[index];
            const next = rows[index + 1];
            if (!next) return false;
            return current.numberKey !== next.numberKey;
        }

        function createTable() {
            const thead = document.getElementById("pronounTableHead");
            const tbody = document.getElementById("tableBody");

            const visiblePronouns = getVisiblePronouns();
            const rows = getVisibleRows();

            thead.innerHTML = "";
            tbody.innerHTML = "";

            if (visiblePronouns.length === 0) {
                alert("Please select at least one pronoun.");
                return;
            }
            if (rows.length === 0) {
                alert("Please select at least one case and one number.");
                return;
            }

            // Only one pronoun is ever shown at a time (picked via the
            // dropdown), so a single flat header row is enough - no need
            // for the grouped two-row header a multi-pronoun table would need.
            thead.innerHTML = `<tr><th class="border-right-thick">Num.</th><th class="border-right-thick">Case</th><th class="border-right-thick">Masculine</th><th class="border-right-thick">Feminine</th><th>Neuter</th></tr>`;

            rows.forEach((rowData, rowIndex) => {
                const bottomBorder = isEndOfVisibleRowGroup(rows, rowIndex) ? "border-bottom-thick" : "";
                let rowHtml = `<tr>`;

                const isFirstOfNumberGroup = rowIndex === 0 || rows[rowIndex - 1].numberKey !== rowData.numberKey;
                if (isFirstOfNumberGroup) {
                    let span = 1;
                    for (let j = rowIndex + 1; j < rows.length && rows[j].numberKey === rowData.numberKey; j++) span++;
                    const groupHasMoreAfter = rowIndex + span < rows.length;
                    rowHtml += `<td rowspan="${span}" class="border-right-thick ${groupHasMoreAfter ? 'border-bottom-thick' : ''}"><strong>${rowData.numberLabel}</strong></td>`;
                }

                rowHtml += `<td class="border-right-thick ${bottomBorder}"><strong>${rowData.caseLabel}</strong></td>`;

                visiblePronouns.forEach(p => {
                    for (let col = 0; col < 3; col++) {
                        const cellClass = `${col === 2 ? 'border-right-thick' : ''} ${bottomBorder}`;
                        rowHtml += `<td class="${cellClass}"><input type="text" data-pronoun="${p.key}" data-row="${rowData.answerRowIndex}" data-col="${col}" autocomplete="off"></td>`;
                    }
                });

                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        function checkAnswers() {
            let score = 0;
            let total = 0;

            document.querySelectorAll("#tableBody input[data-pronoun]").forEach(input => {
                const correctVal = pronounData[input.dataset.pronoun][Number(input.dataset.row)][Number(input.dataset.col)].toLowerCase();
                const val = input.value.trim().toLowerCase();
                const td = input.parentElement;

                total += 1;
                if (val === "") {
                    td.innerHTML = `<span class="blank-text">${correctVal}</span>`;
                } else if (val === correctVal) {
                    td.innerHTML = `<span class="correct">${val}</span>`;
                    score += 1;
                } else {
                    let hint = "";
                    const col = Number(input.dataset.col);
                    const row = Number(input.dataset.row);
                    const matchRow = pronounData[input.dataset.pronoun].findIndex((rowArr, rIdx) =>
                        rIdx !== row && rowArr[col].toLowerCase() === val
                    );
                    if (matchRow !== -1) {
                        hint = ` <span style="color:var(--muted); font-style:italic;">(that's ${rowLabels[matchRow]})</span>`;
                    }
                    td.innerHTML = `<span class="incorrect-text">${val}</span><span class="correction-text">${correctVal}</span>${hint}`;
                }
            });

            document.getElementById('submit-btn').disabled = true;
            document.querySelector(".result").classList.remove("hidden");
            document.querySelector(".results").innerHTML+=`
                <div style="width: calc(((100% - 40px) * 0.25) - 24px); border: 1px solid var(--border); background-color: var(--bg); border-radius: calc(15px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(15px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(15px * var(--radius-mult-br, var(--radius-mult, 1))) calc(15px * var(--radius-mult-bl, var(--radius-mult, 1))); margin:5px; padding: 10px;">
                    <div id="score">${score}/${total} → ${Math.floor((score/total)*100)}%</div>
                    <div id="quotes" style="color: var(--text);">${calcScore(score, total)}</div>
                </div>`;
            const result = {
                date: new Date().toISOString(),

                testType: "Grammar",
                page: document.title,

                score,
                total,
                percent: Math.round(score/total*100),

                quote: calcScore(score,total),

                settings: {
                    pronoun: document.getElementById("pronounSelect").value,
                    cases: getSelectedValues("case"),
                    numbers: getSelectedValues("number")
                }
            };
            let history =JSON.parse(localStorage.getItem("latinHistory")) || [];
                history.unshift(result);
                localStorage.setItem("latinHistory",JSON.stringify(history));
            console.log(localStorage.getItem('latinHistory'));
            localStorage.setItem('achievementVocabDatabaseLoaded', 'true');

        }

        function resetTable() {
            createTable();
            document.getElementById('submit-btn').disabled = false;
        }

        function enableEnterColumnNavigation() {
            // Attribute-based rather than DOM-position-based: the "Num."
            // label cell only appears (rowspan'd) on the first row of each
            // singular/plural group, which shifts every other row's child
            // index out of alignment with it - so column identity is
            // tracked by (pronoun, gender-col) instead of DOM position.
            const table = document.getElementById("pronounTable");

            table.addEventListener("keydown", function (e) {
                if (e.key !== "Enter") return;

                const currentInput = e.target;
                if (currentInput.tagName !== "INPUT" || !currentInput.dataset.pronoun) return;

                e.preventDefault();

                const allInputs = [...table.querySelectorAll("tbody input[data-pronoun]")];
                const colKey = el => el.dataset.pronoun + "|" + el.dataset.col;

                const columns = [];
                const columnIndexByKey = {};
                allInputs.forEach(el => {
                    const key = colKey(el);
                    if (!(key in columnIndexByKey)) {
                        columnIndexByKey[key] = columns.length;
                        columns.push([]);
                    }
                    columns[columnIndexByKey[key]].push(el);
                });

                const myColIdx = columnIndexByKey[colKey(currentInput)];
                const myColumn = columns[myColIdx];
                const posInColumn = myColumn.indexOf(currentInput);

                // 1. Move down in the same logical column
                if (posInColumn + 1 < myColumn.length) {
                    myColumn[posInColumn + 1].focus();
                    return;
                }

                // 2. If at bottom, move to top of the next column
                if (myColIdx + 1 < columns.length) {
                    columns[myColIdx + 1][0].focus();
                    return;
                }

                // 3. If at the very end, wrap back to the first input
                if (columns.length && columns[0].length) columns[0][0].focus();
            });
        }

        document
            .querySelectorAll('[data-group="case"], [data-group="number"]')
            .forEach(control => {
                control.addEventListener("change", resetTable);
            });

        buildPronounSelect();
        document.getElementById("pronounSelect").addEventListener("change", resetTable);

        createTable();
        enableEnterColumnNavigation();
    </script>
</body>
</html>
