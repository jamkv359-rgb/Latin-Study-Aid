<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Library</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .side, .bottom {
    padding: 20px;
    box-sizing: border-box;
  }

  body {
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: min(1000px, 100%);
  }

.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
  }

  h1 { margin: 0; }

  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }

  .category-card {
    padding: 24px;
  }

  .category-card h2 {
    margin: 0 0 16px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .link-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .nav-button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .nav-button:hover {
    transform: translateX(5px);
  }

  .adContainer {
    margin: 20px 0;
    width: min(1000px, 100%);
  }

  .ads {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .ad {
    padding: 10px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
  }

  .xp-factor {width: calc(25% - 30px);}
  .adz {width: 50%}
</style>
<script src="../interact.js">
  /*This javascript file, interact.js, is universal across the entire website, attatched to all pages, so it's probably where the code for the music-playing, across pages, will be implemented. It has a window.onload function as well.*/
</script>
</head>

  <div id="musicLibrary" class="dashboard-grid"></div>
