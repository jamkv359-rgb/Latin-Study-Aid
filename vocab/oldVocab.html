<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Latin Vocab Quiz</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#7dd3fc;
      --muted:#9aa4b2;
      --text:#e6eef6;
      --glass: rgba(255,255,255,0.03);
      --radius:12px;
      font-size:16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: linear-gradient(180deg,#071029 0%, #071022 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:24px;
    }
    .container{
      max-width:900px;
      margin:0 auto;
    }
    header h1{
      margin:0 0 6px 0;
      font-size:28px;
      letter-spacing:0.2px;
    }
    .muted{ color:var(--muted); font-size:14px; }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:16px;
      margin-top:16px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
    }
    .settings .row{ display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    .settings label{ min-width:160px; color:var(--muted); font-size:14px; }
    .settings input[type="text"]{
      flex:1;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.04);
      background:var(--glass);
      color:var(--text);
    }
    .options label{ margin-right:12px; color:var(--muted); font-size:14px; }
    .actions{ display:flex; gap:10px; margin-top:6px; }
    .btn{
      background:linear-gradient(90deg,var(--accent), #38bdf8);
      border:none;
      color:#022;
      padding:9px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }
    .btn.ghost{
      background:transparent;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.03);
    }
    .btn.small{ padding:6px 10px; font-size:14px; border-radius:8px; }

    .hidden{ display:none; }
    .questionCard{ padding:18px; margin-top:8px; border-radius:10px; background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent); }
    .latinWord{ font-size:34px; font-weight:700; margin-bottom:12px; color:var(--accent); }
    .mcOptions{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
    .mcOptions button{ text-align:left; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background:transparent; color:var(--text); cursor:pointer; }
    .typeArea{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    .typeArea input{ flex:1; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background:var(--glass); color:var(--text); }
    .feedback{ min-height:28px; font-weight:600; }
    .feedback.correct{ color:#4ade80; }
    .feedback.wrong{ color:#fb7185; }
    .summary h3{ margin-top:0; }
    footer{ margin-top:18px; color:var(--muted); font-size:13px; text-align:center; }
    @media (max-width:520px){
      .settings label{ min-width:120px; }
      .latinWord{ font-size:24px; }
    }
      .ad {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    flex: 1;
    cursor: pointer;
    transition: all 0.2s;
    width: calc(20%-10px);
    margin: 10px 0px 10px 0px;
}
.ad:hover{
    background: var(--bg);
}

  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1 class="title">Latin Vocabulary Quizz</h1>
      <p class="muted">Choose stages, quiz style, and track progress in your browser.</p>
    </header>
    <div class="ad" onclick="window.location.href='../archives/archivesHome.html'">← Back to Beta Archives homepage</div>
    <section class="settings card">
      <div id="row">
        <label>Stages (e.g., <code>1,3-5</code> or <code>all</code>)</label>
        <input id="stagesInput" type="text" placeholder="all" value="all">
      </div>

      <div class="row">
        <label>Quiz type</label>
        <div class="options">
          <label><input type="radio" name="quizType" value="type" checked> Type-in</label>
          <label><input type="radio" name="quizType" value="mc"> Multiple choice</label>
        </div>
      </div>

      <div class="row">
        <label>Behavior</label>
        <div class="options">
          <label><input id="removeOnCorrect" type="checkbox"> Remove word after correct</label>
          <label><input id="saveProgress" type="checkbox" checked> Save progress (localStorage)</label>
        </div>
      </div>

      <div class="row actions">
        <button id="startBtn" class="btn">Start Quiz</button>
        <button id="resetProgressBtn" class="btn ghost">Reset Progress</button>
      </div>
    </section>

    <section id="quizArea" class="card hidden">
      <div class="quizHeader">
        <div id="stageSummary" class="muted"></div>
        <div id="progress" class="muted"></div>
      </div>

      <div id="questionCard" class="questionCard">
        <div id="latinWord" class="latinWord"></div>

        <div id="mcOptions" class="mcOptions"></div>

        <div id="typeArea" class="typeArea">
          <input id="typeInput" type="text" placeholder="Type the English meaning here">
          <button id="submitType" class="btn small">Submit</button>
        </div>

        <div id="feedback" class="feedback"></div>
      </div>

      <div class="row actions">
        <button id="nextBtn" class="btn ghost">Next</button>
        <button id="endBtn" class="btn ghost">End Session</button>
      </div>

      <div id="mistakeSummary" class="card summary hidden">
        <h3>Mistakes summary</h3>
        <div id="mistakeList"></div>
      </div>
    </section>

    <footer>
      <small class="muted">Works offline in your browser. Progress saved locally if enabled.</small>
    </footer>
  </main>

        28: [["ac", ["and"]], ["atque", ["and"]], ["centum", ["hundred"]], ["cōnstituō", ["decide"]], ["corpus", ["body"]], ["doleō", ["hurt"]], ["gemitus", ["groan"]], ["īra", ["anger"]], ["malus", ["evil"]], ["mandō", ["order"]], ["metus", ["fear"]], ["milia", ["thousands"]], ["mille", ["thousand"]], ["nōnāgintā", ["ninety"]], ["occīdō", ["kill"]], ["octōgintā", ["eighty"]], ["opēs", ["wealth"]], ["quicquam", ["anything"]], ["septuāgintā", ["seventy"]], ["sexāgintā", ["sixty"]], ["sīc", ["thus"]], ["spēs", ["hope"]], ["suspicātus", ["having suspected"]], ["ut", ["as", "so that"]], ["ventus", ["wind"]],],
    };


    // ----------------------------
    // State
    // ----------------------------
    let activeWords = [];
    let currentIndex = -1;
    let modeType = "type";
    let removeOnCorrect = false;
    let saveProgress = true;
    let scores = {};
    let mistakes = {};
    let answeredSet = new Set();
    let allowEnterForNext = false;

    // ----------------------------
    // Helpers
    // ----------------------------
    const normalizeText = (word = "") =>
        word
            .normalize("NFKD")
            .replace(/\p{M}/gu, "")
            .toLowerCase()
            .replace(/[^a-z0-9\s]/g, "")
            .trim();

    function parseSelection(raw) {
        if (!raw) return [];
        if (raw.trim().toLowerCase() === "all") return Array.from({ length: MAX_STAGE }, (_, i) => i + 1);

        const chosen = new Set();
        raw.split(",").map(p => p.trim()).forEach(part => {
            if (part.includes("-")) {
                const [start, end] = part.split("-").map(x => parseInt(x, 10));
                if (!isNaN(start) && !isNaN(end)) {
                    for (let i = Math.max(1, start); i <= Math.min(MAX_STAGE, end); i++) chosen.add(i);
                }
            } else {
                const n = parseInt(part, 10);
                if (!isNaN(n) && n >= 1 && n <= MAX_STAGE) chosen.add(n);
            }
        });
        return [...chosen].sort((a, b) => a - b);
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    // ----------------------------
    // Storage
    // ----------------------------
    function loadProgress() {
        try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; }
        catch { return null; }
    }

    function saveProgressToStorage() {
        if (!saveProgress) return;
        localStorage.setItem(
            LS_KEY,
            JSON.stringify({ answered: [...answeredSet], mistakes, scores })
        );
    }

    function clearProgressStorage() {
        localStorage.removeItem(LS_KEY);
        answeredSet.clear();
        mistakes = {};
        scores = {};
    }

    // ----------------------------
    // Word Management
    // ----------------------------
    function buildWordsFromStages(selectedStages) {
        return selectedStages.flatMap(s => stages[s] || []);
    }

    function pickNextIndex() {
        if (!activeWords.length) return -1;
        const start = Math.floor(Math.random() * activeWords.length);
        for (let i = 0; i < activeWords.length; i++) {
            const idx = (start + i) % activeWords.length;
            const latin = activeWords[idx][0];
            if (!removeOnCorrect && answeredSet.has(latin) && answeredSet.size < activeWords.length) continue;
            return idx;
        }
        return -1;
    }

    // ----------------------------
    // UI
    // ----------------------------
    const $ = id => document.getElementById(id);
    const startBtn = $("startBtn");
    const stagesInput = $("stagesInput");
    const removeOnCorrectEl = $("removeOnCorrect");
    const saveProgressEl = $("saveProgress");
    const quizArea = $("quizArea");
    const latinWordEl = $("latinWord");
    const mcOptionsEl = $("mcOptions");
    const typeArea = $("typeArea");
    const typeInput = $("typeInput");
    const submitType = $("submitType");
    const feedback = $("feedback");
    const nextBtn = $("nextBtn");
    const endBtn = $("endBtn");
    const progressEl = $("progress");
    const stageSummary = $("stageSummary");
    const mistakeList = $("mistakeList");
    const mistakeSummary = $("mistakeSummary");
    const resetProgressBtn = $("resetProgressBtn");
    const title = $("title");

    function renderProgress() {
        progressEl.textContent = `Progress: ${answeredSet.size}/${activeWords.length}`;
    }

    function showQuestionByIndex(idx) {
        if (idx < 0 || idx >= activeWords.length) return;
        currentIndex = idx;
        const [latin, translations] = activeWords[idx];

        latinWordEl.textContent = latin;
        feedback.textContent = "";
        feedback.className = "feedback";
        mcOptionsEl.innerHTML = "";
        typeInput.value = "";

        if (modeType === "mc") {
            typeArea.classList.add("hidden");
            const allTranslations = activeWords.flatMap(w => w[1]).filter(t => !translations.includes(t));
            const options = [...translations];
            while (options.length < 4 && allTranslations.length > 0) {
                options.push(allTranslations.splice(Math.floor(Math.random() * allTranslations.length), 1)[0]);
            }
            shuffle(options);
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.textContent = opt;
                btn.addEventListener("click", () => handleAnswer(opt));
                mcOptionsEl.appendChild(btn);
            });
        } else {
            typeArea.classList.remove("hidden");
        }
        renderProgress();
    }

    // ----------------------------
    // Answer Handling
    // ----------------------------
    function handleAnswer(answer) {
        const ans = typeInput.value.trim();
        if (!ans) return;
        const [latin, translations] = activeWords[currentIndex];
        const isCorrect = translations.map(normalizeText).includes(normalizeText(ans));
        if (isCorrect) {
            feedback.textContent = `✔ ${latin} → ${translations.join(", ")}`;
            feedback.classList.add("correct");
            scores[latin] = (scores[latin] || 0) + 1;

            // Mark that the user can now press Enter to go next
            allowEnterForNext = true;

            if (removeOnCorrect) {
                activeWords = activeWords.filter(w => w[0] !== latin);
            } else {
                answeredSet.add(latin);
            }

            // Disable typing so user sees feedback but can press Enter
            typeInput.disabled = true;
        } else {
            feedback.textContent = `✖ ${latin} → ${translations.join(", ")}`;
            feedback.classList.add("wrong");
            allowEnterForNext = false;
            mistakes[latin] = mistakes[latin] || [];
            mistakes[latin].push(ans);
            typeInput.value = ""; // clear for retry
        }
        saveProgressToStorage();
        renderProgress();
    }

    submitType.addEventListener("click", () => handleAnswer(typeInput.value.trim()));

    typeInput.addEventListener("keydown", e => {
        if (e.key === "Enter") handleAnswer(typeInput.value.trim());
    });

    nextBtn.addEventListener("click", () => {
        const idx = pickNextIndex();
        idx === -1 ? showSummary() : showQuestionByIndex(idx);
    });

    endBtn.addEventListener("click", showSummary);

    resetProgressBtn.addEventListener("click", () => {
        if (confirm("Clear saved progress?")) {
            clearProgressStorage();
            alert("Progress cleared.");
            location.reload();
        }
    });

    function showSummary() {
        quizArea.classList.add("hidden");
        mistakeSummary.classList.remove("hidden");
        mistakeList.innerHTML = "";
        const entries = Object.entries(mistakes).sort((a, b) => b[1].length - a[1].length);
        if (!entries.length) mistakeList.textContent = "None — great job!";
        else entries.forEach(([latin, arr]) => {
            const div = document.createElement("div");
            div.innerHTML = `<strong>${latin}</strong> → ${[...new Set(arr)].join(", ")} (${arr.length})`;
            mistakeList.appendChild(div);
        });
    }

    // ----------------------------
    // Start Quiz
    // ----------------------------
    startBtn.addEventListener("click", () => {
        const chosen = parseSelection(stagesInput.value);
        if (!chosen.length) return alert("No valid stages selected.");

        modeType = document.querySelector('input[name="quizType"]:checked').value;
        removeOnCorrect = removeOnCorrectEl.checked;
        saveProgress = saveProgressEl.checked;

        activeWords = buildWordsFromStages(chosen);
        if (!activeWords.length) return alert("No words found for those stages.");
        shuffle(activeWords);

        if (saveProgress) {
            const saved = loadProgress();
            if (saved?.answered) {
                answeredSet = new Set(saved.answered);
                mistakes = saved.mistakes || {};
                scores = saved.scores || {};
            }
        }

        quizArea.classList.remove("hidden");
        mistakeSummary.classList.add("hidden");
        stageSummary.textContent = `Stages: ${chosen.join(", ")}`;

        const idx = pickNextIndex();
        idx === -1 ? showSummary() : showQuestionByIndex(idx);
    });

    // ----------------------------
    // Keyboard navigation
    // ----------------------------
    document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();

        // Only go to next if the allowEnterForNext flag is set
        if (allowEnterForNext) {
            const next = pickNextIndex();
            if (next === -1) {
                showSummary();
            } else {
                showQuestionByIndex(next);
            }
            allowEnterForNext = false;
            typeInput.disabled = false; // re-enable typing for next word
            typeInput.focus();          // keep cursor in the box
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        // Defaults already set via HTML
    });

  </script>
</body>
