  <style>
    body {

  background: #f4f4f4;
  color: #222;
}

h1, h2 {
  margin-top: 0;
}

.controls label {
  display: block;
  margin: 6px 0;
}

button {
  margin-top: 10px;
  padding: 6px 12px;
  font-size: 1em;
}

.hidden {

}

#question {

}

#feedback {

}

#score {

}

/* 🌙 Dark mode */
body.dark {
  background: #121212;
  color: #eee;
}

body.dark input,
body.dark button {
  background: #333;
  color: #eee;
  border: 1px solid #666;
}
.ad {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    flex: 1;
    cursor: pointer;
    transition: all 0.2s;
    width: calc(20%-10px);
    margin: 10px 0px 10px 0px;
}
.ad:hover{
    background: var(--bg);
}


  </style>

  <script>
    let vocab = [];
    let pool = [];
    let current = null;
    let score = 0;
    let total = 0;
    let timerInterval = null;
    let timeLeft = 0;

    /* 🔹 LOAD VOCAB FROM JS FILE */
    vocab = vocabData;
    buildCheckboxes();



    /* 🔹 BUILD STAGE + TYPE CHECKBOXES */
    function buildCheckboxes() {
    const stages = [...new Set(vocab.map(v => v.stage))];
    const types = [...new Set(vocab.map(v => v.type))];

    const stageDiv = document.getElementById("stageCheckboxes");
    const typeDiv = document.getElementById("typeCheckboxes");

    stages.forEach(s => {
        stageDiv.innerHTML += `<label><input type="checkbox" value="${s}" checked> ${s}</label>`;
    });

    types.forEach(t => {
        typeDiv.innerHTML += `<label><input type="checkbox" value="${t}" checked> ${t}s</label>`;
    });
    }

    /* 🔹 START TEST */
    document.getElementById("startBtn").onclick = () => {
        const selectedStages =
            [...document.querySelectorAll("#stageCheckboxes input:checked")]
            .map(cb => cb.value);

        const selectedTypes =
            [...document.querySelectorAll("#typeCheckboxes input:checked")]
            .map(cb => cb.value);

        pool = vocab.filter(v =>
            selectedStages.includes(String(v.stage)) &&
            selectedTypes.includes(v.type)
        );

        if (pool.length === 0) {
            alert("No words selected!");
            return;
        }

        score = 0;
        total = 0;

        document.querySelector(".tester").classList.remove("hidden");
        nextQuestion();
    };

    /* 🔹 NEXT QUESTION */
    function nextQuestion() {
    if (pool.length === 0) {
        document.getElementById("question").textContent = "Finished!";
        return;
    }

    current = pool[Math.floor(Math.random() * pool.length)];
    total++;

    const englishToLatin = document.getElementById("directionToggle").checked;
    document.getElementById("question").textContent =
    englishToLatin ? current.english : current.latin;

    document.getElementById("answerInput").value = "";
    document.getElementById("feedback").textContent = "";

    if (document.getElementById("timerToggle").checked) {
        startTimer();
    }
    }

    /* 🔹 SUBMIT ANSWER */
    document.getElementById("submitBtn").onclick = () => {
    const input = document.getElementById("answerInput").value.trim().toLowerCase();
    const englishToLatin = document.getElementById("directionToggle").checked;
    const correct =
    String(englishToLatin ? current.latin : current.english).toLowerCase();

    if (input === correct) {
        score++;
        document.getElementById("feedback").textContent = "✅ Correct!";
        if (document.getElementById("noRepeatToggle").checked) {
        pool = pool.filter(w => w !== current);
        }
    } else {
        document.getElementById("feedback").textContent = `❌ Correct answer: ${correct}`;
    }

    document.getElementById("score").textContent = `Score: ${score} / ${total}`;

    stopTimer();
    setTimeout(nextQuestion, 700);
    };

    /* 🔹 TIMER */
    function startTimer() {
    stopTimer();
    timeLeft = 10;
    document.getElementById("timer").textContent = `Time: ${timeLeft}`;

    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = `Time: ${timeLeft}`;
        if (timeLeft <= 0) {
        stopTimer();
        nextQuestion();
        }
    }, 1000);
    }

    function stopTimer() {
    clearInterval(timerInterval);
    }

    /* 🔹 DARK MODE */
    document.getElementById("darkModeToggle").onchange = e => {
    document.body.classList.toggle("dark", e.target.checked);
    };

  </script>
