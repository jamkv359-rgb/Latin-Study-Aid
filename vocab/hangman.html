<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="../theme.css">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: min(600px, 92vw);
            margin: 40px 0;
            text-align: center;
        }

        header {
            padding: 20px 24px;
            border-radius: calc(14px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(14px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(14px * var(--radius-mult-br, var(--radius-mult, 1))) calc(14px * var(--radius-mult-bl, var(--radius-mult, 1)));
            margin-bottom: 20px;
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        h1 { margin: 0; }

        .sub-header {
            margin-top: 8px;
            padding: 6px 12px;
            display: inline-block;
        }

        .game-card {
            padding: 40px 24px;
            border-radius: calc(14px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(14px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(14px * var(--radius-mult-br, var(--radius-mult, 1))) calc(14px * var(--radius-mult-bl, var(--radius-mult, 1)));
        }

        .display {
            letter-spacing: 12px;
            margin: 20px 0;
        }

        .lives {
            margin-bottom: 5px;
        }

        .worongLetters {
            margin-bottom: 25px;
            min-height: 1.2em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .answerInput {
            padding: 12px;
            width: 160px;
            text-align: center;
            outline: none;
            transition: 0.15s ease;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: calc(10px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(10px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(10px * var(--radius-mult-br, var(--radius-mult, 1))) calc(10px * var(--radius-mult-bl, var(--radius-mult, 1)));
            font-weight: 600;
            font-family: inherit;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 20px;
            min-height: 3em;
        }
        .adContainer {
            margin-top: 20px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: calc(14px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(14px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(14px * var(--radius-mult-br, var(--radius-mult, 1))) calc(14px * var(--radius-mult-bl, var(--radius-mult, 1)));
            text-align: center;
        }
        .ads {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .ad {
            flex: 1;
            padding: 10px;
            cursor: pointer;
        }
    </style>
    <script src="../interact.js"></script>
</head>
<body data-page-type="vocab">
<img class="banner" src="../banner2.png" alt="" style="width: 100%; position: fixed;  height: 10vh; object-fit: cover; top: 0; left: 0;   z-index: 9999;" >
<div style="margin-top: 15vh;" class="container">
    <header>
        <h1>Latin Hangman Game</h1>
        <div style="color:var(--muted); margin: 10px 0px 5px 0px"><span id="username-greet"></span>Try and guess a latin word from the description~</div>
        <div class='interact' style= "background: var(--bg); border: 1px solid var(--border); border-radius: calc(15px * var(--radius-mult-tl, var(--radius-mult, 1))) calc(15px * var(--radius-mult-tr, var(--radius-mult, 1))) calc(15px * var(--radius-mult-br, var(--radius-mult, 1))) calc(15px * var(--radius-mult-bl, var(--radius-mult, 1))); width: fit-content; padding: 5px 15px 5px 15px; margin-bottom: 24px; margin-top:10px;"></div>
    </header>

    <div class="game-card">
        <div class="lives"></div>
        <div class="display"></div>
        <div class="worongLetters">Wrong Letters: </div>
        
        <div class="input-group">
            <input type="text" id="answerInput" class="answerInput" placeholder="Guess..." autocomplete="off">
            <button id="submitBtn" style="background-color:var(--bluepop);">Submit Guess</button>
        </div>

        <div class="message"></div>
    </div>

</div>
<script src="../achievementData.js"></script>
<script src="vocabDataLSA.js"></script>
<script src="vocabData.js"></script> 

<script>
document.querySelector("body").classList.toggle("dark"); 
    /* =========================
       ELEMENTS
    ========================== */

    const button1 = document.getElementById("submitBtn");
    const displayDiv = document.querySelector(".display");
    const livesDiv = document.querySelector(".lives");
    const wrongDiv = document.querySelector(".worongLetters");
    const inputDiv = document.querySelector(".answerInput");
    const messageDiv = document.querySelector(".message");

    /* =========================
       GAME STATE
    ========================== */

    let currentWord = null;

    let answer = "";
    let answerLetters = [];

    let display = [];
    let wrongLetters = [];

    let lives = 10;

    /* =========================
       MACRON STANDARDIZER
    ========================== */

    function normalizeLatin(str) {

        return str
            .toLowerCase()
            .trim()

            // convert combining macrons 
            .replace(/a\u0304/g, "a")
            .replace(/e\u0304/g, "e")
            .replace(/i\u0304/g, "i")
            .replace(/o\u0304/g, "o")
            .replace(/u\u0304/g, "u")
            .replace(/y\u0304/g, "y")
            .replace("ā", "a")
            .replace("ē", "e")
            .replace("ī", "i")
            .replace("ō", "o")
            .replace("ū", "u")
            .replace("ȳ", "y")
            .replace(/ā/g, "a")
            .replace(/ē/g, "e")
            .replace(/ī/g, "i")
            .replace(/ō/g, "o")
            .replace(/ū/g, "u")
            .replace(/ȳ/g, "y")

            // normalize unicode
            .normalize("NFC");
    }

    function hasSpecialCharacters(str) {
        // Also excludes spaces and hyphens (e.g. "-ne", "grātiās agere")
        // - the original punctuation-only check let multi-word phrases
        // and enclitic-particle entries slip into single-word games.
        return /[!?,.():+\-\s]/.test(str);
    }

    function isSafeWord(word) {
        let latinForms = word.latin;
        let englishMeanings = word.english;

        for (let l of latinForms) {
            if (hasSpecialCharacters(l)) {
                return false;
            }
        }

        for (let e of englishMeanings) {
            if (hasSpecialCharacters(e)) {
                return false;
            }
        }

        return true;
    }

    /* =========================
       START GAME
    ========================== */

    function hangMan() {

        let safeVocab = filterVocabUpToChapter(vocabData).filter(isSafeWord);

        if (safeVocab.length === 0) {
            messageDiv.textContent = "No valid vocab words available.";
            return;
        }

        currentWord =
            safeVocab[Math.floor(Math.random() * safeVocab.length)];

        answer =
            normalizeLatin(currentWord.latin[0]);

        answerLetters = [...answer];

        display = [];
        wrongLetters = [];
        lives = 10;

        for (let char of answerLetters) {

            if (char === " " || char === "-") {
                display.push(char);
            } else {
                display.push("_");
            }
        }

        messageDiv.innerHTML = `
            Guess a letter or the whole word!<br>
            <strong>${capitalize(currentWord.type)}</strong>
            ${currentWord.subtype
                ? ` • ${capitalize(currentWord.subtype)}`
                : ""}
            <br>
            Meaning: ${currentWord.english.join(", ")}
        `;

        updateUI();

        button1.textContent = "Submit Guess";
        button1.onclick = process;
    }
    /* =========================
       UPDATE UI
    ========================== */

    function updateUI() {

        displayDiv.textContent =
            display.join(" ");

        livesDiv.textContent =
            `❤️ ${lives} Lives Left`;

        wrongDiv.textContent =
            `Wrong Letters: ${wrongLetters.join(", ")}`;
    }

    /* =========================
       PROCESS INPUT
    ========================== */

    function process() {

        let guess =
            normalizeLatin(inputDiv.value);

        inputDiv.value = "";

        if (!guess) return;

        let guessLetters = [...guess];

        /* =====================
           SINGLE LETTER
        ====================== */

        if (guessLetters.length === 1) {

            let letter = guessLetters[0];

            // already guessed
            if (
                display.includes(letter) ||
                wrongLetters.includes(letter)
            ) {

                messageDiv.innerHTML = `
                    Already guessed '${letter}'!
                `;

                return;
            }

            // correct
            if (answerLetters.includes(letter)) {

                for (let i = 0; i < answerLetters.length; i++) {

                    if (answerLetters[i] === letter) {
                        display[i] = letter;
                    }
                }

            } else {

                lives--;
                wrongLetters.push(letter);
            }
        }

        /* =====================
           WHOLE WORD
        ====================== */

        else {

            if (guess === answer) {

                display = [...answerLetters];

            } else {

                for (let letter of guessLetters) {

                    if (
                        display.includes(letter) ||
                        wrongLetters.includes(letter)
                    ) {
                        continue;
                    }

                    if (answerLetters.includes(letter)) {

                        for (let i = 0; i < answerLetters.length; i++) {

                            if (answerLetters[i] === letter) {
                                display[i] = letter;
                            }
                        }

                    } else {

                        lives--;
                        wrongLetters.push(letter);
                    }
                }
            }
        }

        updateUI();
        checkGameOver();
    }

    /* =========================
       GAME OVER
    ========================== */

    function checkGameOver() {

        if (!display.includes("_")) {

            messageDiv.innerHTML = `
                <strong>Optime!</strong><br>
                You found '<strong>${answer}</strong>'<br>
                Meaning: ${currentWord.english.join(", ")}<br>
                Type: ${capitalize(currentWord.type)}
                ${currentWord.subtype
                    ? ` (${capitalize(currentWord.subtype)})`
                    : ""}
            `;

            // Feed the same per-word progress tracking every other tester
            // uses, so hangman rounds count toward weak-word tracking and
            // achievements instead of vanishing once the page is left.
            updateWordCompletion(currentWord, true);

            resetGameButton();
        }

        else if (lives <= 0) {

            messageDiv.innerHTML = `
                <strong>Game Over!</strong><br>
                The word was '<strong>${answer}</strong>'<br>
                Meaning: ${currentWord.english.join(", ")}<br>
                Type: ${capitalize(currentWord.type)}
                ${currentWord.subtype
                    ? ` (${capitalize(currentWord.subtype)})`
                    : ""}
            `;

            updateWordCompletion(currentWord, false);

            resetGameButton();
        }
    }

    /* =========================
       RESET BUTTON
    ========================== */

    function resetGameButton() {

        button1.textContent = "New Word";
        button1.onclick = hangMan;
    }

    /* =========================
       HELPERS
    ========================== */

    function capitalize(str) {

        if (!str) return "";

        return str.charAt(0).toUpperCase()
            + str.slice(1);
    }

    /* =========================
       ENTER KEY
    ========================== */

    inputDiv.addEventListener("keydown", (e) => {

        if (e.key === "Enter") {
            process();
        }
    });

    /* =========================
       START
    ========================== */

    hangMan();

</script>

</body>
</html>
